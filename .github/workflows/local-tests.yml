name: Local skill tests

on:
  push:
    paths:
      - 'gws-drive/**'
      - 'gws-sheets/**'
      - 'tests/**'
      - 'install.ps1'
      - 'install.sh'
      - '.github/workflows/local-tests.yml'
  pull_request:
    paths:
      - 'gws-drive/**'
      - 'gws-sheets/**'
      - 'tests/**'
      - 'install.ps1'
      - 'install.sh'
      - '.github/workflows/local-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-examples:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Require supported PowerShell
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.3') { throw 'PowerShell 7.3+ required' }
          if (-not (Get-Command pwsh -CommandType Application -ErrorAction Stop)) { throw 'pwsh unavailable' }
      - name: Check documented native arguments and failures
        run: python -B -m unittest discover -s tests -p test_shell_examples.py -v
      - name: Test PowerShell installer
        run: python -B -m unittest discover -s tests -p test_install_powershell.py -v
  portable-tracker:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Test portable Python tracker
        run: python -B -m unittest discover -s tests -p test_tracker_portable.py -v
  local-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Install Bash and jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bash jq
      - name: Run offline tests
        run: python3 -B -m unittest discover -s tests -v
